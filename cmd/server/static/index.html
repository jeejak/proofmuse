<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProofMuse by Jeejak</title>
<meta name="description" content="Cek bukti packing sebelum paket dikirim. Checks packing photos at the bench. Built on Meta Muse Spark 1.3 and SAM 3.1.">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="/static/favicon-32.png?v=3" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#0a1430">
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--ink:#0f1b33;--muted:#5b6a85;--line:#dfe5ef;--soft:#eef2f8;
  --navy:#0e2152;--teal:#139a9c;--green:#2f9e3a;--accent:#0e2152;--accent-ink:#fff;
  --kuat:#1d7a46;--kuat-bg:#e3f4e8;--dicek:#8a5a00;--dicek-bg:#fdf0d5;--lemah:#b3261e;--lemah-bg:#fbe5e3;
  --box:#13a36f;--shadow:0 1px 2px rgba(15,27,51,.06),0 8px 24px rgba(15,27,51,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1430;--card:#111d3d;--ink:#eef2f9;--muted:#9aa8c4;--line:#22305a;--soft:#17244a;
  --accent:#4fd1c5;--accent-ink:#06213a;--teal:#4fd1c5;--green:#7ad66b;
  --kuat:#7ad69a;--kuat-bg:#15362a;--dicek:#f2c25b;--dicek-bg:#3a2e12;--lemah:#f2867e;--lemah-bg:#3d1b1e;
  --shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:880px;margin:0 auto;padding:0 16px 120px}
a{color:var(--teal)}
small,.muted{color:var(--muted)}
.en{color:var(--muted);font-size:13px}
button{font:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}

/* top bar and hero */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700}
.brand img{width:32px;height:32px;border-radius:50%}
.brand span{color:var(--muted);font-weight:500;font-size:14px}
.top .r{display:flex;gap:8px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:5px 11px;font-size:13px;font-weight:700;color:var(--muted)}
.lang button.on{background:var(--soft);color:var(--ink)}
.seller{margin-top:6px;font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.top a.gh{font-size:14px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.hero{padding:8px 0 4px}
.hero h1{font-size:clamp(34px,7vw,52px);line-height:1.02;margin:6px 0 10px;letter-spacing:-.03em}
.hero h1 b{background:linear-gradient(90deg,#16a7a9,#4cc24a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;font-size:18px;max-width:640px}
.hero p.en{font-size:15px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--ink)}
.chip.meta{border-color:transparent;background:var(--navy);color:#fff}
:root:not([data-theme="light"]) .chip.meta{}
@media (prefers-color-scheme:dark){.chip.meta{background:#1d2f63}}

/* cards and steps */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0;box-shadow:var(--shadow)}
.step{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.step i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--ink);font-weight:700;font-size:14px;flex:none}
.step h2{font-size:18px;margin:0}

/* sample cards */
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sample{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;overflow:hidden;padding:0}
.sample img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--soft)}
.sample div{padding:8px 10px 10px}
.sample b{display:block;font-size:14px;line-height:1.3}
.sample small{font-size:12px}
.sample.on{outline:3px solid var(--teal);outline-offset:-1px}
.other{margin-top:12px}
.other summary{cursor:pointer;color:var(--muted);font-size:14px}
select{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.order{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:14px}
.order .resi{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:16px}
.warn{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--dicek-bg);color:var(--dicek);font-size:14px}

/* photos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:4px 0 12px}
.ph{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.ph.flag{border:2px solid var(--lemah)}
.ph.ans{outline:3px solid var(--teal);outline-offset:2px}
.ph .img{position:relative}
.ph img{display:block;width:100%;height:auto}
.ph .n{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:700;border-radius:7px;padding:1px 8px}
.ph .tag{position:absolute;top:8px;right:8px;background:var(--teal);color:#06213a;font-size:11px;font-weight:800;border-radius:7px;padding:2px 8px}
.ph .bx{position:absolute;border:2px solid var(--box);border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.ph .bx span{position:absolute;top:-21px;left:-2px;background:var(--box);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;white-space:nowrap}
.ph .meta{padding:8px 10px 0;font-size:13px;min-height:28px}
.ph .meta .bad{color:var(--lemah);font-weight:700}
.ph .meta .ok{color:var(--kuat);font-weight:600;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.ph .acts{display:flex;gap:6px;padding:8px 10px 10px}
.ph .acts button{flex:1;font-size:13px;padding:6px 4px;border:1px solid var(--line);background:var(--card);border-radius:9px;white-space:nowrap}
.add{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add label span{display:block;text-align:center;border:1.5px dashed var(--line);border-radius:12px;padding:12px;cursor:pointer;font-weight:600}
input[type=file]{display:none}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}

/* action bar */
.bar{position:sticky;bottom:0;z-index:5;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.go{width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink)}
.go:disabled{opacity:.5;cursor:default}
.status{display:none;margin-top:10px}
.status.on{display:block}
.progress{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.progress li{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.progress li::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.progress li.now{color:var(--ink);font-weight:600}
.progress li.now::before{border-color:var(--teal);border-top-color:transparent;animation:s 1s linear infinite}
.progress li.done::before{background:var(--teal);border-color:var(--teal)}
@keyframes s{to{transform:rotate(360deg)}}
.err{color:var(--lemah);font-size:14px}

/* result */
.verdict{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px}
.verdict.kuat{background:var(--kuat-bg);color:var(--kuat)}
.verdict.perlu_dicek{background:var(--dicek-bg);color:var(--dicek)}
.verdict.lemah{background:var(--lemah-bg);color:var(--lemah)}
.verdict .big{font-size:26px;font-weight:800;line-height:1.1}
.verdict .sub{font-size:14px;opacity:.85}
.verdict .ico{font-size:30px}
.reasons{list-style:none;padding:0;margin:12px 0 0}
.reasons li{padding:12px 0;border-top:1px solid var(--line)}
.reasons li:first-child{border-top:0}
.reasons b{display:block}
.reasons .todo{margin-top:3px}
.advisory{font-size:13px;color:var(--muted);margin:12px 0 0}
.retake{margin-top:12px;width:100%;border:1px solid var(--teal);background:transparent;color:var(--teal);border-radius:12px;padding:11px;font-weight:700}
.hist{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.badge{display:inline-block;font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px}
.badge.kuat{background:var(--kuat-bg);color:var(--kuat)}
.badge.perlu_dicek{background:var(--dicek-bg);color:var(--dicek)}
.badge.lemah{background:var(--lemah-bg);color:var(--lemah)}

/* claim */
textarea{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.qs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px}
.sec{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:11px;font-weight:700}
.claimtype{font-weight:800;font-size:20px}
.gaps{margin:8px 0 0;padding-left:18px}
.gaps li{margin:6px 0}

details summary{cursor:pointer;font-weight:700}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;min-width:520px}
td,th{text-align:left;padding:6px 6px;border-top:1px solid var(--line);vertical-align:top}
.famlinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.famlinks a{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
.famlinks a span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
footer{font-size:13px;color:var(--muted);margin:28px 0 12px}
</style>
</head>
<body>
<main>
<nav class="top">
  <a class="brand" href="https://jeejak.id"><img src="/static/jeejak-icon.png?v=2" alt="">ProofMuse <span>by Jeejak</span></a>
  <div class="r">
    <div class="lang" role="group" aria-label="Language"><button id="lang-en" type="button">EN</button><button id="lang-id" type="button">ID</button></div>
    <a class="gh" href="https://github.com/jeejak/proofmuse">GitHub</a>
  </div>
</nav>

<header class="hero">
  <h1 data-t="h1"></h1>
  <p data-t="lead"></p>
  <p class="en" data-t="lead2"></p>
  <!-- Figures from docs/eval/full-test.md (held-out test split). Update together. -->
  <div class="chips">
    <span class="chip meta">Meta Muse Spark 1.3 · SAM 3.1</span>
    <span class="chip" data-t="chip1"></span>
    <span class="chip" data-t="chip2"></span>
    <span class="chip" data-t="chip3"></span>
    <span class="chip" data-t="chip4"></span>
  </div>
</header>

<section class="card">
  <div class="step"><i>1</i><h2 data-t="step1"></h2></div>
  <div class="samples" id="samples"></div>
  <p class="note" data-t="samplesNote"></p>
  <details class="other"><summary data-t="other"></summary>
    <select id="order" aria-label="Order"></select>
  </details>
  <div class="order" id="orderInfo"></div>
  <div class="warn hidden" id="mismatch"></div>
</section>

<section class="card">
  <div class="step"><i>2</i><h2 data-t="step2"></h2></div>
  <div class="grid" id="photos"></div>
  <div class="add">
    <label><input type="file" id="cam" accept="image/*" capture="environment"><span data-t="cam"></span></label>
    <label><input type="file" id="pick" accept="image/jpeg,image/png" multiple><span data-t="gallery"></span></label>
  </div>
  <p class="note" data-t="dummy"></p>
</section>

<div class="bar">
  <button class="go" id="go" disabled></button>
  <div class="status card" id="status">
    <ol class="progress" id="progress"></ol>
  </div>
  <p class="err" id="err"></p>
</div>

<section class="card hidden" id="result">
  <div class="step"><i>3</i><h2 data-t="step3"></h2></div>
  <div id="verdict"></div>
  <ul class="reasons" id="reasons"></ul>
  <div id="retakeHint"></div>
  <p class="advisory" id="advisory"></p>
</section>

<section class="card hidden" id="history">
  <h2 style="font-size:16px;margin:0 0 8px" data-t="attempts"></h2>
  <div class="hist" id="hist"></div>
</section>

<section class="card hidden" id="claim">
  <div class="step"><i>4</i><h2 data-t="step4"></h2></div>
  <p class="note" style="margin:0 0 10px" data-t="claimNote"></p>
  <div class="qs" id="claimSamples"></div>
  <textarea id="claimText" rows="2" maxlength="1000" placeholder="kak paketnya kosong, ga ada barangnya"></textarea>
  <button class="sec" id="claimGo"></button>
  <p class="err" id="claimErr"></p>
  <div id="claimOut"></div>
</section>

<section class="card hidden" id="trace">
  <details>
    <summary data-t="hood"></summary>
    <p class="en" id="traceSum"></p>
    <div class="tbl"><table><thead><tr><th data-t="thStep"></th><th data-t="thPhoto"></th><th data-t="thWhy"></th><th data-t="thResult"></th><th data-t="thCost"></th></tr></thead><tbody id="traceRows"></tbody></table></div>
  </details>
</section>

<section class="card family">
  <h2 style="font-size:16px;margin:0 0 6px" data-t="famTitle"></h2>
  <p class="note" style="margin:0 0 12px" data-t="famText"></p>
  <div class="famlinks">
    <a href="https://play.google.com/store/apps/details?id=id.jeejak.paket"><b>JejakPaket</b><span data-t="famApp"></span></a>
    <a href="https://paket.jeejak.id"><b>Jeejak console</b><span data-t="famConsole"></span></a>
    <a href="https://jeejak.id/en/"><b>jeejak.id</b><span data-t="famSite"></span></a>
  </div>
</section>

<footer data-t="footer"></footer>
</main>

  },
};
const SAMPLE_EN = { R79: 'Too dark, then retaken', R83: 'Blurry, then retaken', R87: 'Unreadable tracking no., then retaken', R91: 'Not sealed, then retaken', R39: 'Wrong label on the box', R70: 'Label too far away', R04: 'Two parcels, complete proof' };
const THUMB = { R70: 0 }; // the far-label shot is mostly empty table; show the item instead
const CLAIM_SAMPLES = ['kak paketnya kosong, ga ada barangnya 😭', 'barangnya nyampe pecah gan', 'warnanya beda sama yg aku pesen', 'yg dateng cuma 1, aku pesen 2', 'udh seminggu blm nyampe kak'];
const ICON = { kuat: '✅', perlu_dicek: '🔍', lemah: '⚠️' };

let lang = new URLSearchParams(location.search).get('lang') || (() => { try { return localStorage.getItem('pm.lang'); } catch { return null; } })() || 'en';
if (!T[lang]) lang = 'en';
const t = k => T[lang][k];

let orders = [], samples = [], msgs = {}, photos = [], attempts = [], current = null, retakeSet = null, triage = null;
let photoOrder = null; // the order the loaded sample photos belong to
let loading = false;

function setLang(l) {
  lang = l;
  try { localStorage.setItem('pm.lang', l); } catch {}
  document.documentElement.lang = l;
  $('lang-en').classList.toggle('on', l === 'en');
  $('lang-id').classList.toggle('on', l === 'id');
  document.querySelectorAll('[data-t]').forEach(e => { e.innerHTML = t(e.dataset.t); });
  $('claimGo').textContent = t('claimBtn');
  renderSamples(); showOrder(); render();
  if (current) show(current, false);
  if (triage) showClaim(triage, false);
}

async function init() {
  [orders, samples, msgs] = await Promise.all(['/api/orders', '/api/samples', '/api/messages'].map(u => fetch(u).then(r => r.json())));
  for (const o of orders) $('order').append(el('option', { value: o.order_id, textContent: `${o.order_id} · ${o.courier} · ${o.resi}` }));
  $('order').onchange = () => { showOrder(); resetResult(); };
  $('cam').onchange = e => addFiles(e.target.files, e.target);
  $('pick').onchange = e => addFiles(e.target.files, e.target);
  $('go').onclick = check;
  $('claimGo').onclick = readClaim;
  $('lang-en').onclick = () => setLang('en');
  $('lang-id').onclick = () => setLang('id');
  for (const c of CLAIM_SAMPLES) $('claimSamples').append(el('button', { textContent: c, onclick: () => { $('claimText').value = c; } }));
  setLang(lang);
  if (samples.length) await loadSample(samples[0]);
}

function renderSamples() {
  const box = $('samples'); box.innerHTML = '';
  for (const s of samples) {
    const [main, sub] = lang === 'en' ? [SAMPLE_EN[s.id] || s.title, s.title] : [s.title, SAMPLE_EN[s.id] || ''];
    const b = el('button', { class: 'sample' + (photoOrder === s.order_id ? ' on' : ''), onclick: () => loadSample(s) },
      el('img', { src: s.photos[s.id in THUMB ? THUMB[s.id] : s.photos.length - 1], alt: '', loading: 'lazy' }),
      el('div', {}, el('b', { textContent: main }), el('small', { textContent: sub })));
    b.dataset.id = s.id;
    box.append(b);
  }
}

function showOrder() {
  const o = orders.find(o => o.order_id === $('order').value);
  $('orderInfo').innerHTML = '';
  if (o) $('orderInfo').append(
    el('span', {}, t('resi') + ' ', el('span', { class: 'resi', textContent: o.resi })),
    el('span', { textContent: o.courier }), el('span', { textContent: t('koli')(o.koli) }),
    el('span', { textContent: o.marketplace }), el('span', { textContent: o.listing_item }));
  const off = photoOrder && photos.length && photoOrder !== $('order').value;
  $('mismatch').classList.toggle('hidden', !off);
  if (off) $('mismatch').textContent = t('mismatch')(photoOrder);
}

// Fetch the sample's photos first, then switch order and photos together,
// so the page never shows one order beside another sample's photos.
async function loadSample(s) {
  if (loading) return;
  loading = true; $('go').disabled = true;
  try {
    const ps = await Promise.all(s.photos.map(urlToPhoto));
    photos = ps; photoOrder = s.order_id; retakeSet = s.retake || null;
    $('order').value = s.order_id;
    attempts = []; resetResult(); renderSamples(); showOrder();
  } finally { loading = false; render(); }
}

async function urlToPhoto(u) {
  const b = await (await fetch(u)).blob();
  return { blob: b, url: URL.createObjectURL(b) };
}

// Phones produce 4 to 12 MB photos. Shrink to a 2048 px long side in the
// browser so the upload is quick; the server still downsizes for the
// model and crops the label from this copy for the second-pass read.
async function shrink(file) {
  const img = await createImageBitmap(file);
  const s = Math.min(1, 2048 / Math.max(img.width, img.height));
  if (s === 1 && file.size < 3e6) return file;
  const c = el('canvas', { width: Math.round(img.width * s), height: Math.round(img.height * s) });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
}

async function addFiles(files, input, at) {
  for (const f of files) {
    const b = await shrink(f);
    const p = { blob: b, url: URL.createObjectURL(b) };
    if (at !== undefined) photos[at] = p; else if (photos.length < 8) photos.push(p);
  }
  input.value = '';
  if (at === undefined) photoOrder = null; // own photos: no sample order to warn about
  resetResult(); renderSamples(); showOrder(); render();
}

function retake(i) {
  const inp = el('input', { type: 'file', accept: 'image/*' });
  inp.setAttribute('capture', 'environment');
  inp.onchange = () => addFiles(inp.files, inp, i);
  inp.click();
}

function photoProblems(p) {
  if (!p) return [];
  const out = (p.image_quality_issues || []).map(q => t('issues')[q] || q);
  if (p.label_in_photo === 'yes' && p.label_readable !== 'yes') out.push(t('unreadable'));
  return out;
}

function render() {
  const g = $('photos'); g.innerHTML = '';
  const res = current && current.result;
  photos.forEach((p, i) => {
    const obs = res && res.photos && res.photos[i];
    const probs = photoProblems(obs);
    const box = res && (res.grounding || []).find(x => x.photo === i + 1);
    const wrap = el('div', { class: 'img' }, el('img', { src: p.url, alt: `Photo ${i + 1}` }), el('span', { class: 'n', textContent: i + 1 }));
    if (box) {
      const b = box.box;
      wrap.append(el('div', { class: 'bx', style: `left:${b.x_min / 10}%;top:${b.y_min / 10}%;width:${(b.x_max - b.x_min) / 10}%;height:${(b.y_max - b.y_min) / 10}%` },
        el('span', { textContent: `label · SAM ${box.confidence.toFixed(2)}` })));
    }
    const ans = triage && triage.answers.includes(i + 1);
    if (ans) wrap.append(el('span', { class: 'tag', textContent: t('answers') }));
    const meta = el('div', { class: 'meta' });
    if (obs) meta.append(probs.length ? el('span', { class: 'bad', textContent: '⚠ ' + probs.join(', ') }) : el('span', { class: 'ok', textContent: obs.resi_text ? '✓ ' + obs.resi_text : '✓ ' + t('clear') }));
    const acts = el('div', { class: 'acts' },
      el('button', { textContent: t('retakeAct'), onclick: () => retake(i) }),
      el('button', { textContent: t('remove'), onclick: () => { photos.splice(i, 1); resetResult(); render(); } }));
    g.append(el('div', { class: 'ph' + (probs.length ? ' flag' : '') + (ans ? ' ans' : '') }, wrap, meta, acts));
  });
  $('go').disabled = loading || !photos.length || !$('order').value;
  $('go').textContent = attempts.length ? t('goAgain') : t('go');
}

function resetResult() { current = null; triage = null; $('claimOut').innerHTML = ''; $('claimErr').textContent = ''; ['result', 'trace', 'claim'].forEach(id => $(id).classList.add('hidden')); $('err').textContent = ''; }

function progress(n) {
  $('progress').innerHTML = '';
  t('steps').forEach((label, i) => $('progress').append(el('li', { class: i < n ? 'done' : i === n ? 'now' : '', textContent: label })));
}

async function check() {
  $('err').textContent = ''; $('go').disabled = true; $('status').classList.add('on');
  let step = 0; progress(0);
  const tick = setInterval(() => { step = Math.min(step + 1, 3); progress(step); }, 2200);
  try {
    const fd = new FormData();
    fd.append('order_id', $('order').value);
    photos.forEach((p, i) => fd.append('photo', p.blob, `${i + 1}.jpg`));
    const r = await fetch('/api/checks', { method: 'POST', body: fd });
    let c = await r.json();
    if (!r.ok) throw new Error(c.error || r.statusText);
    while (c.status === 'queued' || c.status === 'running') {
      await new Promise(r => setTimeout(r, 1000));
      c = await (await fetch('/api/checks/' + c.id)).json();
    }
    if (c.status !== 'done') throw new Error(c.error || 'check failed');
    progress(4);
    current = c; attempts.push(c); show(c, true);
  } catch (e) {
    $('err').textContent = t('failed') + e.message;
  } finally {
    clearInterval(tick); $('status').classList.remove('on'); render();
  }
}

function show(c, scroll) {
  const r = c.result, v = r.verdict.verdict, vt = msgs.verdicts[v];
  const [big, small] = lang === 'en' ? [vt[1], vt[0]] : [vt[0], vt[1]];
  $('verdict').innerHTML = '';
  $('verdict').append(el('div', { class: 'verdict ' + v }, el('span', { class: 'ico', textContent: ICON[v] }),
    el('div', {}, el('div', { class: 'big', textContent: big }), el('div', { class: 'sub', textContent: small + (c.reused ? ' · ' + t('cached') : '') }))));
  $('reasons').innerHTML = '';
  for (const code of r.verdict.reasons || []) {
    const m = msgs.reasons[code];
    const [p, todo, p2, todo2] = lang === 'en' ? [m.problem_en, m.retake_en, m.problem, m.retake] : [m.problem, m.retake, m.problem_en, m.retake_en];
    $('reasons').append(el('li', {}, el('b', { textContent: p }), el('div', { class: 'todo', textContent: '→ ' + todo }),
      el('div', { class: 'seller', textContent: `${t('sellerSees')} ${p2}. ${todo2}` })));
  }
  if (!(r.verdict.reasons || []).length) $('reasons').append(el('li', {}, el('b', { textContent: t('allClear') })));
  $('advisory').textContent = lang === 'en' ? msgs.advisory_en : msgs.advisory;
  $('retakeHint').innerHTML = '';
  if (v !== 'kuat' && retakeSet) {
    $('retakeHint').append(el('button', { id: 'retakeBtn', class: 'retake', textContent: t('retakeBtn'), onclick: async () => { photos = await Promise.all(retakeSet.map(urlToPhoto)); retakeSet = null; resetResult(); render(); window.scrollTo({ top: $('photos').offsetTop - 80, behavior: 'smooth' }); } }));
  }
  $('result').classList.remove('hidden');

  $('hist').innerHTML = '';
  attempts.forEach((a, i) => {
    if (i) $('hist').append('→');
    const vv = msgs.verdicts[a.result.verdict.verdict];
    $('hist').append(el('span', {}, `#${i + 1} `, el('span', { class: 'badge ' + a.result.verdict.verdict, textContent: lang === 'en' ? vv[1] : vv[0] })));
  });
  $('history').classList.toggle('hidden', attempts.length < 2);

  $('traceRows').innerHTML = '';
  for (const s of r.trace) {
    $('traceRows').append(el('tr', {}, el('td', { textContent: s.name }), el('td', { textContent: s.photo || '' }), el('td', { textContent: s.why }), el('td', { textContent: s.result }), el('td', { textContent: '$' + (s.usage.cost_usd || 0).toFixed(4) })));
  }
  const u = r.usage;
  $('traceSum').textContent = `${(r.latency_ns / 1e9).toFixed(1)} s · $${u.cost_usd.toFixed(4)} · ${u.input_tokens} input / ${u.output_tokens} output tokens (${u.reasoning_tokens} reasoning) · ${u.images} SAM images · prompt ${r.prompt_version}` + (c.reused ? ' · ' + t('cached') : '') + '. ' + t('traceFoot');
  $('trace').classList.remove('hidden');
  $('claim').classList.remove('hidden');
  if (scroll) $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function readClaim() {
  const text = $('claimText').value.trim();
  if (!text || !current) return;
  $('claimErr').textContent = ''; $('claimGo').disabled = true; $('claimGo').textContent = t('claimBusy');
  try {
    const r = await fetch(`/api/checks/${current.id}/claim`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    const tr = await r.json();
    if (!r.ok) throw new Error(tr.error || r.statusText);
    triage = tr; showClaim(tr, true); render();
  } catch (e) {
    $('claimErr').textContent = t('failed') + e.message;
  } finally {
    $('claimGo').disabled = false; $('claimGo').textContent = t('claimBtn');
  }
}

function showClaim(tr, scroll) {
  const out = $('claimOut'); out.innerHTML = '';
  const ct = msgs.claims[tr.claim_type];
  const [main, sub] = lang === 'en' ? [ct.en, ct.id] : [ct.id, ct.en];
  out.append(el('div', { class: 'claimtype', textContent: main }), el('div', { class: 'en', textContent: sub }));
  if (tr.claim_type === 'lainnya') { out.append(el('p', { textContent: t('otherClaim') })); return; }
  out.append(el('p', { textContent: tr.answers.length ? t('answeredBy')(tr.answers.map(n => '#' + n).join(', ')) : t('noAnswer') }));
  if (tr.missing.length) {
    out.append(el('b', { textContent: t('notShown') }));
    const ul = el('ul', { class: 'gaps' });
    for (const g of tr.missing) {
      const [a, b] = lang === 'en' ? [msgs.gaps[g].en, msgs.gaps[g].id] : [msgs.gaps[g].id, msgs.gaps[g].en];
      ul.append(el('li', {}, a, el('div', { class: 'en', textContent: b })));
    }
    out.append(ul);
  }
  out.append(el('p', { class: 'advisory', textContent: `${t('claimFoot')} $${tr.usage.cost_usd.toFixed(5)}` }));
  if (scroll && tr.answers.length) $('photos').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

init().catch(e => { $('err').textContent = 'Failed to load: ' + e.message; });
</script>
</body>
</html>
